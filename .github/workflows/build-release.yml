name: 🎮 Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🏗️ Build Linux
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Setup Node (needed for semantic-release) ──────
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # ── Compute next version (dry run) ──────────────
      - name: 📦 Compute next version
        id: version
        run: |
          npx semantic-release@24 --dry-run 2>&1 | tee /tmp/sr.log || true
          VER=$(grep -oP 'next release version is \K[0-9]+\.[0-9]+\.[0-9]+' /tmp/sr.log || echo "1.0.0")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "→ Next version: $VER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Unity Library cache ─────────────────────────
      - name: ♻️ Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.5.0f1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-6000.5.0f1-

      # ── Build (auto-activates license from secrets) ─
      - uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.5.0f1
          targetPlatform: StandaloneLinux64
          buildMethod: BuildScript.PerformLinuxBuild
          versioning: Custom
          version: ${{ steps.version.outputs.version || '1.0.0' }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # ── Package into tarball ────────────────────────
      - name: 📦 Create archive
        run: |
          VERSION="${{ steps.version.outputs.version || '1.0.0' }}"
          BUILD_DIR="build/StandaloneLinux64"
          mkdir -p dist
          echo "→ Creating project-game-linux-${VERSION}.tar.gz"
          tar -czf "dist/project-game-linux-${VERSION}.tar.gz" -C "$BUILD_DIR" .
          ls -lh "dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: project-game-linux
          path: dist/project-game-linux-*.tar.gz
          retention-days: 7

  release:
    name: 🚀 Release
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - uses: actions/download-artifact@v4
        with:
          name: project-game-linux
          path: ./

      # ── Publish GitHub Release ──────────────────────
      - name: 🚀 Semantic Release
        run: npx semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
