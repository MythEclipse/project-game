name: 🚀 Release Linux (build-from-tag)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    name: 🚀 GitHub Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        continue-on-error: true
        id: download
        with:
          name: project-game-linux
          path: ./

      - name: 📦 Create release notes & attach binary
        id: release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "→ Tag: $TAG, Version: $VERSION"

          # Cek apakah ada artifact yang diupload (build sebelumnya diupload manual)
          FOUND=$(ls project-game-linux-*.tar.gz 2>/dev/null || echo "")
          if [ -n "$FOUND" ]; then
            echo "→ Found pre-built archive: $FOUND"
            ASSETS="$FOUND"
          fi

          # Generate release notes dari commit log
          PREV_TAG=$(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline --no-decorate "${PREV_TAG}..${TAG}" 2>/dev/null | head -100)
            echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
            echo "## What's Changed" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$NOTES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
            echo "## Initial Release" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "First tagged release $TAG" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: v${{ steps.release.outputs.version }}
          body: ${{ steps.release.outputs.release_notes }}
          artifacts: ${{ steps.release.outputs.assets }}
          token: ${{ secrets.GITHUB_TOKEN }}
